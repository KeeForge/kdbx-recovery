name: Recovery tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install '.[test]' build
      - name: Install independent KeePassXC oracle
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y keepassxc
          echo 'KEEPASSXC_CLI=/usr/bin/keepassxc-cli' >> "$GITHUB_ENV"
          echo 'QT_QPA_PLATFORM=offscreen' >> "$GITHUB_ENV"
      - name: Check source
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test recovery, refusal, and independent interoperability
        run: python -m pytest --cov=kdbx_recovery --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Build installable distributions
        run: python -m build
      - name: Check installed command
        run: kdbx-recover --version
